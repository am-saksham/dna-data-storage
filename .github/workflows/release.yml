name: Build DNA Codec Executables

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # Install Rust
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller maturin
          pip install -r requirements.txt || true
          
      - name: Build Rust Library (dna_codec)
        run: pip install ./dna_codec
        
      - name: Build Windows Executable
        run: pyinstaller --name "DNACodec" --windowed --onefile --clean gui.py
        
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNACodec-Windows-exe
          path: dist/DNACodec.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # Install Rust
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Install PyQT Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 xvfb
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller maturin
          pip install -r requirements.txt || true
          
      - name: Build Rust Library (dna_codec)
        run: pip install ./dna_codec
        
      - name: Build Linux Executable
        run: pyinstaller --name "DNACodec" --windowed --onefile --clean gui.py
        
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNACodec-Linux
          path: dist/DNACodec
